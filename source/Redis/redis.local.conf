# Local Redis for betterSkillys (used by "Run Server.bat").
# Only this PC can connect; the game servers are what players talk to.
bind 127.0.0.1
port 6379
protected-mode yes
# Keep the game database in source/Redis/data: a snapshot every few minutes plus an
# append-only log, so nothing is lost if the window is closed.
dir ./data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
