# Redis 7 (Ubuntu's redis-server) for betterSkillys, the Linux twin of source/Redis/redis.local.conf.
# The port comes from bsk.env (deploy/systemd/bsk-redis.service passes --port).
bind 127.0.0.1 -::1
protected-mode yes
daemonize no
logfile ""
dir /opt/bsk/redis/data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
# A Redis 3.2 appendonly.aof copied into the data folder is upgraded to appendonlydir/ on the
# first start (SETUP-LOCAL.md, "Running on a VPS").
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
