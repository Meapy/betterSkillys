[package]
name = "bsk-client"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "betterskillys"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
bsk-assets.workspace = true
bsk-data.workspace = true
bsk-net.workspace = true
bsk-proto.workspace = true
bsk-render.workspace = true
bsk-session.workspace = true
bsk-world.workspace = true
futures.workspace = true
image.workspace = true
log.workspace = true
web-time.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Location"] }
